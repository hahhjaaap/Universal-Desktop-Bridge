name: udb-audit-regressions
on:
  push:
    branches: [udb/audit-fixes-20261108]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: udb-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete Cloudflare and Render unit tests
        run: node --test cloudflare/tests/*.test.js render/tests/*.test.mjs

  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[office,dev]'
      - run: python -m ruff check src tools tests
      - run: python -m ruff format --check .
      - run: python tools/audit_repository.py --strict
      - run: python tools/check_import_boundaries.py
      - name: Validate UDB security, OAuth, installation, and package contracts
        run: |
          python -m pytest -q \
            tests/test_cloudflare_access_preflight.py \
            tests/test_cloudflare_deployment.py \
            tests/test_cloudflare_jwt_preflight.py \
            tests/test_cloudflare_public_gate.py \
            tests/test_cloud_agent.py \
            tests/test_cloud_parallel.py \
            tests/test_cloud_lifecycle.py \
            tests/test_cloud_pair.py \
            tests/test_installation_layout.py \
            tests/test_package.py

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[office,dev]'
      - name: Windows package and cloud diagnostics
        shell: pwsh
        run: |
          python -m pytest -q tests/test_package.py tests/test_installation_layout.py tests/test_cloudflare_access_preflight.py tests/test_cloud_agent.py
          python tools/check_windows_workflows.py --host-scenario
