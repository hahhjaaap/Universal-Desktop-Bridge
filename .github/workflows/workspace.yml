name: common-room-workspace
on:
  push:
    paths:
      - 'examples/chatgpt-workspace/**'
      - 'tests/test_common_room_inbox.py'
      - '.github/workflows/workspace.yml'
  pull_request:
    paths:
      - 'examples/chatgpt-workspace/**'
      - 'tests/test_common_room_inbox.py'
      - '.github/workflows/workspace.yml'
permissions:
  contents: read
jobs:
  windows-workspace:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: examples/chatgpt-workspace
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install --target browser_deps -r requirements-browser.txt
      - run: python -m pip install pytest
      - run: python -m pytest -q ../../tests/test_common_room_inbox.py
      - run: python -B room.py selftest
      - run: python -B chain.py --selftest
      - run: python -B fast_live.py selftest
      - run: python -B workspace.py --selftest
      - run: python -B browser_flow.py --selftest

