name: UDB HyperSpeed UIA snapshot cache parity

on:
  pull_request:
    paths:
      - "src/udb/computer_uia.ps1"
      - "tests/fixtures/uia_snapshot_form.ps1"
      - "tests/core/test_uia_cache_parity_harness.py"
      - "tools/compare_uia_snapshot_cache.py"
      - ".github/workflows/hyperspeed-uia-parity.yml"
  push:
    branches: [main]
    paths:
      - "src/udb/computer_uia.ps1"
      - "tests/fixtures/uia_snapshot_form.ps1"
      - "tests/core/test_uia_cache_parity_harness.py"
      - "tools/compare_uia_snapshot_cache.py"
      - ".github/workflows/hyperspeed-uia-parity.yml"

permissions:
  contents: read

jobs:
  native-fixture-parity:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Check Python parity harness syntax
        run: python -m compileall -q tools/compare_uia_snapshot_cache.py
      - name: Compare snapshot cache on/off in test-owned Windows Forms
        run: python tools/compare_uia_snapshot_cache.py --samples 1 --sizes 50 500 1000 --output reports/uia-snapshot-parity.json
      - run: python -m pip install .
      - name: Compare 30 warm snapshots per mode and fixture size
        run: python -m tools.compare_uia_snapshot_cache --warm --samples 30 --sizes 50 500 1000 --output reports/uia-snapshot-warm-parity.json
      - name: Verify dynamic control invalidation in persistent UIA workers
        run: python -m tools.compare_uia_snapshot_cache --dynamic-warm --samples 10 --sizes 50 500 1000 --output reports/uia-snapshot-dynamic-parity.json
      - name: Attach isolated fixture parity report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hyperspeed-uia-parity
          path: reports/uia-snapshot*-parity.json
          if-no-files-found: ignore
          retention-days: 7
