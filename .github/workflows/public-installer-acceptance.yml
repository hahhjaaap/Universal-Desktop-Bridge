name: public-installer-acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-installer-acceptance.yml
      - tools/check_public_installer.py
      - tests/test_public_installer_contract.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-windows-install:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install and exercise the public release with system-only PATH
        run: python tools/check_public_installer.py --report reports/public-installer.json
      - name: Show verified result
        shell: pwsh
        run: Get-Content reports/public-installer.json
      - name: Save independent published-release acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-installer-verification
          path: reports/public-installer.json
          retention-days: 7
