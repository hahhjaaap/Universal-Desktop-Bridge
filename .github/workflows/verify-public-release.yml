name: verify-published-windows-release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/check_public_installer.py
      - tests/test_public_installer_contract.py
      - .github/workflows/verify-public-release.yml
permissions:
  contents: read
jobs:
  verify-public-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify published Windows installer in isolated temporary directory
        run: python tools/check_public_installer.py --report reports/public-installer.json
      - name: Publish read-only acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-installer-verification
          path: reports/public-installer.json
          retention-days: 7
