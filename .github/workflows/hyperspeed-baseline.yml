name: UDB HyperSpeed baseline and safety gates

on:
  pull_request:
    paths:
      - "src/udb/hyperspeed_perf.py"
      - "src/udb/cloud_agent.py"
      - "src/udb/proxy.py"
      - "src/udb/host_service.py"
      - "src/udb/host_client.py"
      - "src/udb/computer_desktop.py"
      - "src/udb/host_browser.py"
      - "tools/hyperspeed_*"
      - "tests/core/test_hyperspeed_perf.py"
      - "docs/hyperspeed-steps-01-10.md"
      - ".github/workflows/hyperspeed-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source and test tools
        run: python -m pip install -e ".[dev]"
      - name: Formatting and import gates
        run: |
          python -m ruff check src/udb/hyperspeed_perf.py src/udb/cloud_agent.py src/udb/proxy.py src/udb/host_service.py src/udb/host_client.py src/udb/computer_desktop.py src/udb/host_browser.py tools/hyperspeed_benchmark.py tools/hyperspeed_dashboard.py tests/core/test_hyperspeed_perf.py
          python -m ruff format --check src/udb/hyperspeed_perf.py src/udb/cloud_agent.py src/udb/proxy.py src/udb/host_service.py src/udb/host_client.py src/udb/computer_desktop.py src/udb/host_browser.py tools/hyperspeed_benchmark.py tools/hyperspeed_dashboard.py tests/core/test_hyperspeed_perf.py
      - name: Contract, redaction and percentile tests
        run: python -m pytest -q tests/core/test_hyperspeed_perf.py
      - name: Offline representative workload sampling
        run: python -m tools.hyperspeed_benchmark --iterations 4 --output hyperspeed-baseline.json
      - name: Generate local dashboard
        run: python -m tools.hyperspeed_dashboard --input hyperspeed-baseline.json --output hyperspeed-baseline.html
      - name: Check deterministic fixture contract
        run: |
          python -c "import json; x=json.load(open('hyperspeed-baseline.json',encoding='utf-8')); assert x['mode']=='synthetic' and x['scenario_count']==30 and x['sample_count']==120 and len(x['scenarios'])==30"
      - name: Attach synthetic diagnostic artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyperspeed-synthetic-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            hyperspeed-baseline.json
            hyperspeed-baseline.html
          retention-days: 14
