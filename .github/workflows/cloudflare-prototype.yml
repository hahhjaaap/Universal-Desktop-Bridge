name: cloudflare-private-relay-validation
on:
  pull_request:
    paths:
      - "cloudflare/**"
      - "render/**"
      - "render.yaml"
      - "docs/render-observer.md"
      - "src/udb/cloud_agent.py"
      - "src/udb/cloud_pair.py"
      - "src/udb/cloud_secrets.py"
      - "tests/test_cloud_secrets.py"
      - "src/udb/manager.py"
      - "src/udb/desktop.py"
      - "src/udb/manager_refresh.py"
      - "tests/test_cloud_lifecycle.py"
      - "tests/test_cloud_pair.py"
      - "tests/test_cloud_agent.py"
      - "tests/test_cloud_backoff.py"
      - "tests/test_cloud_failures.py"
      - "tools/cloud_enroll.py"
      - ".github/workflows/cloudflare-prototype.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloud relay and Render dashboard unit tests
        run: node --test cloudflare/tests/*.test.js render/tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: UDB Python client tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_cloud_agent.py tests/test_cloud_pair.py tests/test_cloud_lifecycle.py tests/test_cloud_secrets.py tests/test_cloud_backoff.py tests/test_cloud_failures.py
          python -m ruff check src/udb/cloud_agent.py src/udb/cloud_pair.py src/udb/cloud_secrets.py tests/test_cloud_agent.py tests/test_cloud_pair.py tests/test_cloud_lifecycle.py tests/test_cloud_secrets.py tests/test_cloud_backoff.py tests/test_cloud_failures.py tools/cloud_enroll.py
          python -m ruff format --check src/udb/cloud_agent.py src/udb/cloud_pair.py src/udb/cloud_secrets.py tests/test_cloud_agent.py tests/test_cloud_pair.py tests/test_cloud_lifecycle.py tests/test_cloud_secrets.py tests/test_cloud_backoff.py tests/test_cloud_failures.py tools/cloud_enroll.py
