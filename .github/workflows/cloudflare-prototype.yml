name: cloudflare-private-relay-validation
on:
  pull_request:
    paths:
      - "cloudflare/**"
      - "render/**"
      - "render.yaml"
      - "docs/render-observer.md"
      - "src/udb/tool_families.json"
      - "src/udb/tool_families.py"
      - "src/udb/catalog.py"
      - "tests/test_tool_families.py"
      - "tests/test_cloudflare_unified_59.py"
      - "src/udb/cloud_agent.py"
      - "src/udb/cloud_pair.py"
      - "src/udb/cloud_secrets.py"
      - "tests/test_cloud_secrets.py"
      - "src/udb/manager.py"
      - "src/udb/desktop.py"
      - "src/udb/manager_refresh.py"
      - "tests/test_cloud_lifecycle.py"
      - "tests/test_cloud_pair.py"
      - "tests/test_cloud_agent.py"
      - "tests/test_cloud_backoff.py"
      - "tests/test_cloud_failures.py"
      - "tests/test_cloudflare_deployment.py"
      - "tests/test_cloudflare_access_preflight.py"
      - "tools/check_cloudflare_deployment.py"
      - "tools/check_fleet_isolated_config.py"
      - "tests/test_fleet_isolated_config.py"
      - ".github/workflows/cloudflare-prototype.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Cloud relay and Render dashboard unit tests
        run: node --test cloudflare/tests/*.test.js render/tests/*.test.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: UDB Python client tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_cloud_agent.py tests/test_cloud_pair.py tests/test_cloud_lifecycle.py tests/test_cloud_secrets.py tests/test_cloud_backoff.py tests/test_cloud_failures.py tests/test_cloudflare_deployment.py tests/test_cloudflare_access_preflight.py tests/test_tool_families.py tests/test_cloudflare_unified_59.py tests/test_fleet_isolated_config.py
          python -m ruff check src/udb/cloud_agent.py src/udb/cloud_pair.py src/udb/cloud_secrets.py tests/test_cloud_agent.py tests/test_cloud_pair.py tests/test_cloud_lifecycle.py tests/test_cloud_secrets.py tests/test_cloud_backoff.py tests/test_cloud_failures.py tests/test_cloudflare_deployment.py tools/check_cloudflare_deployment.py
          python -m ruff format --check src/udb/cloud_agent.py src/udb/cloud_pair.py src/udb/cloud_secrets.py tests/test_cloud_agent.py tests/test_cloud_pair.py tests/test_cloud_lifecycle.py tests/test_cloud_secrets.py tests/test_cloud_backoff.py tests/test_cloud_failures.py tests/test_cloudflare_deployment.py tools/check_cloudflare_deployment.py tools/check_fleet_isolated_config.py tests/test_fleet_isolated_config.py
          python -m tools.check_fleet_isolated_config
