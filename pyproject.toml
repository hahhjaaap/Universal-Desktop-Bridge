[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-desktop-bridge"
dynamic = ["version"]
description = "Windows MCP bridge with one source package and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp==2.3.0",
  "websocket-client==1.9.2",
  "pywin32==312; sys_platform == 'win32'",
  "PySide6-Essentials==6.12.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
office = ["openpyxl==3.1.5", "python-docx==1.2.0", "pypdf==7.0.1", "reportlab==5.1.0"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "setuptools>=77", "wheel", "ruff>=0.17,<0.18"]
freeze = ["pyinstaller>=6.16,<7"]

[project.scripts]
udb = "udb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["_udb_compat", "udb_tool_catalog", "udb_recovery", "udb_managed_process", "udb_background", "udb_system_processes", "udb_companion", "udb_extensions", "udb_virtual_pointer", "udb_features", "udb_unified", "udb_work_journal", "udb_documents"]

[tool.setuptools.dynamic]
version = {attr = "udb._version.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
udb = ["*.ps1", "*.json", "companion/*.ps1"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC", "S607"]

[tool.ruff.lint.per-file-ignores]
# Pytest resolves this imported fixture by argument name.
"tests/core/test_tasks_050.py" = ["F401", "F811"]
