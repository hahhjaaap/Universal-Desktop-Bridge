name: WS9 Windows shutdown investigation
on:
  pull_request:
    types: [synchronize]
    paths:
      - docs/windows-pytest-shutdown.md
      - .github/workflows/ws9-windows-shutdown-probe.yml

permissions:
  contents: read

jobs:
  raw-pytest:
    if: github.event.pull_request.number == 238 && github.event.pull_request.head.repo.full_name == github.repository
    name: Raw pytest (3.12, ${{ matrix.group }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [qt_and_win32, qt_and_neither, win32_and_neither]
    env:
      PYTHONFAULTHANDLER: '1'
      UDB_RUN_INTERACTIVE_WINDOWS_TESTS: '1'
      UDB_NATIVE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install ".[office,dev]"
      - name: Run the documented grouped reproducer
        shell: pwsh
        run: |
          git rev-list --parents -n1 HEAD
          $note = Get-Content -Raw -LiteralPath docs/windows-pytest-shutdown.md
          $fence = [regex]::Match($note, '(?s)```powershell\r?\n(.*?)\r?\n```')
          if (-not $fence.Success) { throw 'Reproducer missing from the investigation note' }
          & ([scriptblock]::Create($fence.Groups[1].Value))
