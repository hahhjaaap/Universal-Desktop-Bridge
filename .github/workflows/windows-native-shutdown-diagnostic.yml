name: Windows pytest native shutdown diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/windows-native-shutdown-diagnostic.yml

permissions:
  contents: read

jobs:
  raw-shutdown:
    # Run only on the WS15 diagnostic draft. This is not a required CI check.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/ws15-native-shutdown-evidence-20261119'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            group: qt-only
          - python: '3.12'
            group: without-qt-tests
          - python: '3.12'
            group: without-win32-tests
          - python: '3.12'
            group: without-manager-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[office,dev]"
      - name: Record pytest and native shutdown separately
        shell: pwsh
        env:
          UDB_RUN_INTERACTIVE_WINDOWS_TESTS: '1'
          PYTHONFAULTHANDLER: '1'
          UDB_NATIVE_GROUP: ${{ matrix.group }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $driver = @'
          import os
          import re
          import sys
          from pathlib import Path

          import pytest

          group = os.environ["UDB_NATIVE_GROUP"]
          tests = sorted(p for p in Path("tests").rglob("test_*.py")
                         if p.parts[:2] != ("tests", "components"))
          qt = set()
          win = set()
          for path in tests:
              source = path.read_text(encoding="utf-8-sig")
              if re.search(r"PySide6|shiboken6|QApplication|QThread|QTimer", source):
                  qt.add(path)
              if re.search(r"\bwin32[a-z]+\b|pywintypes|WINFUNCTYPE|CFUNCTYPE", source):
                  win.add(path)
          excluded = {
              "qt-only": set(tests) - qt,
              "without-qt-tests": qt,
              "without-win32-tests": win,
              "without-manager-ui": {Path("tests/test_manager_ui.py")},
          }[group]
          print(f"UDB_NATIVE_GROUP={group} files={len(tests) - len(excluded)}", flush=True)
          code = int(pytest.main(["-q", *(f"--ignore={p}" for p in sorted(excluded))]))
          print(f"UDB_PYTEST_RETURN={code}", flush=True)
          qt = sys.modules.get("PySide6.QtCore")
          app_live = qt is not None and qt.QCoreApplication.instance() is not None
          loaded = sorted(name for name in sys.modules if
                          name.startswith(("PySide6", "shiboken6", "win32", "pywintypes")))
          print(f"UDB_NATIVE_STATE app={app_live} modules={loaded}", flush=True)
          raise SystemExit(code)
          '@
          python -X faulthandler -c $driver
          $code = $LASTEXITCODE
          'UDB_NATIVE_EXIT=0x{0:X8} ({1})' -f ([int64]$code -band 0xFFFFFFFFL), $code
          exit $code
